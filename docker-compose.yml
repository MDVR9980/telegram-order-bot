services:
  bot:
    build: .
    container_name: linoria-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data                   # database (orders, settings, prices) survives restarts/updates
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
